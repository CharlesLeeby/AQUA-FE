extends: continuity_optimized_frontend.yaml

hybrid:
  # Paper-facing continuity enhancement.
  #
  # The base continuity frontend already uses quality-triggered KLT
  # preservation plus learned recovery. This variant makes feature confidence
  # local: each grid cell contributes its own underwater degradation score, so
  # births/recoveries in locally hazy, flat, shadowed, or overexposed regions
  # are down-weighted without discarding the whole frame.
  enable_local_quality_map: true
  local_quality_rows: 4
  local_quality_cols: 6
  local_quality_weight: 0.45
  local_quality_min_learned_score: 0.08
  local_quality_min_birth_score: 0.06
  local_quality_apply_to_candidate_scoring: true
  local_quality_apply_to_output_q: true
