extends: loftr_extreme_only_frontend.yaml

hybrid:
  # VINS-safe old-ID recovery: recovered classical tracks may re-enter the KLT
  # state only under persistent or severe frontend degradation. This protects
  # VINS landmark identity in A05-like healthy/isolated low-grid frames while
  # preserving A08/A09-like recovery bursts.
  enable_classical_identity_safe_gate: true
  classical_identity_safe_history_size: 5
  classical_identity_safe_min_recent_triggers: 2
  classical_identity_safe_max_grid_coverage: 0.72
  classical_identity_safe_min_dropout_ratio: 0.30
  classical_identity_safe_max_frontend_state: 0.87
  classical_identity_safe_max_track_health: 0.88
  classical_identity_safe_large_batch: 50
  classical_identity_safe_min_grid_gain: 0.01
  classical_identity_safe_max_fraction: 0.30
  classical_identity_safe_warmup_frames: 12

  # Keep provenance for source-aware q_i and export diagnostics.
  enable_source_provenance_memory: true
  source_provenance_recovered_hold_frames: 8
  source_provenance_learned_hold_frames: 8
  source_provenance_quality_scale_recovered: 0.90
  source_provenance_quality_scale_learned: 0.92

measurement_selection:
  enabled: false

backend_quality:
  mode: source_aware
  floor: 0.80
  alpha: 0.85
