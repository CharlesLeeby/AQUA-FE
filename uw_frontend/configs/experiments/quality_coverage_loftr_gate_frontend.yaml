extends: loftr_extreme_only_frontend.yaml

hybrid:
  # Experimental middle ground between the permissive sparse probe and the
  # very strict KLT-degeneracy gate. LoFTR may propose points only when the
  # KLT support is spatially sparse and the underwater quality model indicates
  # low texture/degradation. This keeps normal high-coverage windows inert,
  # but does not require the geometry scheduler to pre-label the frame as
  # planar/severe before LoFTR can be tested.
  loftr_requires_planar_severe: false
  semidense_fallback_requires_degradation: true
  semidense_fallback_min_grid_coverage: 0.86
  semidense_fallback_min_degradation: 0.34
  semidense_fallback_min_flat_region_ratio: 0.25
  semidense_fallback_min_grid_texture_score: 0.75
  semidense_fallback_min_frame_gap: 4

  source_aware_loftr_modes:
    - low_coverage_recovery
    - low_texture
    - planar_near_wall
    - extreme_textureless

  # Keep accepted batches small enough to behave as a sidecar, not a
  # replacement for the KLT backbone.
  semidense_fallback_max_new: 50
  semidense_fallback_sidecar_max_extra: 50
  semidense_fallback_max_fraction: 0.16
  semidense_fallback_reserve_gftt_features: 0

  # Candidate filters are looser than the strict VINS gate, because LoFTR
  # points in texture-poor water often have lower patch NCC, but the acceptance
  # gate below still requires coverage utility and residual neutrality.
  semidense_candidate_min_quality: 0.12
  semidense_candidate_min_ncc: 0.40
  semidense_candidate_max_fb_error: 1.20
  semidense_candidate_max_epipolar_error: 1.40
  semidense_candidate_max_homography_error: 2.80
  source_aware_loftr_max_epipolar_error: 1.40
  source_aware_loftr_max_homography_error: 2.80

  # Formal acceptance: LoFTR must add cells/coverage and keep F/H residuals
  # close to the KLT-only reference geometry.
  semidense_acceptance_min_new_tracks: 3
  semidense_acceptance_min_grid_gain: 0.010
  semidense_acceptance_min_new_cells: 1
  semidense_acceptance_min_new_cell_ratio: 0.20
  semidense_acceptance_max_f_inlier_drop: 0.030
  semidense_acceptance_max_h_inlier_drop: 0.030
  semidense_acceptance_max_epipolar_error_ratio: 1.08
  semidense_acceptance_max_homography_error_ratio: 1.12
  semidense_acceptance_residual_neutral: true
  semidense_acceptance_max_epipolar_error_abs_increase: 0.030
  semidense_acceptance_max_homography_error_abs_increase: 0.080

  # Backend-facing safety remains conservative if this profile is later used
  # for export: confirmed LoFTR points are few and initially down-weighted.
  source_aware_loftr_requires_confirmation: true
  source_aware_loftr_min_confirmation_frames: 3
  learned_confirmation_geometry_safe: true
  promotion_loftr_min_quality: 0.20
  promotion_loftr_max_fb_error: 1.00
  promotion_loftr_min_ncc: 0.48
  promotion_loftr_quality_scale: 0.55
  promotion_loftr_max_confirmed: 6
