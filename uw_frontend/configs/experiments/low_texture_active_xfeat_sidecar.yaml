extends: paper_vins_safe_learned_sidecar.yaml

hybrid:
  # Low-texture-active profile for attribution experiments.
  #
  # Keep the KLT/GFTT backbone, but make the XFeat sidecar less starved than
  # the paper-safe default. Final VINS export is still controlled by the
  # explicit degradation, geometry, coverage, temporal, and source gates in
  # export_vins_features.py.
  learned_confirmation_min_frames: 2
  learned_confirmation_max_pending: 500
  learned_confirmation_max_confirmed: 60
  learned_confirmation_reserve_capacity: 40
  learned_confirmation_preserve_new_pending: true
  learned_confirmation_geometry_safe: true

  learned_sidecar_max_extra: 60
  max_learned_initialized: 60
  max_learned_init_fraction: 0.20
  reserve_gftt_features: 0
  learned_init_requires_degradation: true
  learned_init_min_degradation: 0.40
  learned_init_min_flat_region_ratio: 0.64
  learned_init_min_grid_coverage: 0.92
  learned_init_critical_grid_coverage: 0.82
  enable_learned_init_acceptance_gate: true
  learned_init_acceptance_weak_max_new: 24
  learned_init_acceptance_weak_max_fraction: 0.08
  learned_init_acceptance_weak_min_grid_gain: 0.01
  learned_init_acceptance_weak_min_new_cell_ratio: 0.15

  promotion_xfeat_max_confirmed: 8
  promotion_xfeat_min_quality: 0.12
  promotion_xfeat_max_fb_error: 1.10
  promotion_xfeat_min_ncc: 0.48
  promotion_xfeat_min_grid_coverage: 0.92

  source_provenance_learned_hold_frames: 20
  source_provenance_quality_scale_learned: 0.90
