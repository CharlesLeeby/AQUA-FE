extends: loftr_extreme_only_frontend.yaml

hybrid:
  # End-to-end VINS-safe profile:
  # - KLT remains the persistent backbone.
  # - Classical old-ID recovery is disabled because A05 showed it can corrupt
  #   landmark identity and destabilize VINS even when learned points are absent.
  # - Learned/SP-LG and LoFTR are admitted only as confirmed sidecar additions.
  preserve_klt_replenish: true
  enable_classical_recovery: false
  enable_lk_recovery: false
  enable_learned_recovery: false
  enable_learned_initialization: true
  enable_semidense_fallback_initialization: true
  enable_learned_track_memory: false
  enable_gftt_confirmation: false
  enable_source_provenance_memory: true
  source_provenance_recovered_hold_frames: 0
  source_provenance_learned_hold_frames: 10
  source_provenance_quality_scale_recovered: 1.0
  source_provenance_quality_scale_learned: 0.92

  learned_init_requires_klt_confirmation: true
  source_aware_loftr_requires_confirmation: true
  learned_confirmation_min_frames: 4
  learned_confirmation_max_pending: 500
  learned_confirmation_max_confirmed: 24
  learned_sidecar_max_extra: 24
  max_learned_initialized: 36
  max_learned_init_fraction: 0.10

  promotion_lightglue_max_confirmed: 16
  promotion_lightglue_min_quality: 0.12
  promotion_lightglue_max_fb_error: 0.95
  promotion_lightglue_min_ncc: 0.55

  promotion_xfeat_max_confirmed: 2
  promotion_xfeat_min_quality: 0.18
  promotion_xfeat_max_fb_error: 0.85
  promotion_xfeat_min_ncc: 0.58

  source_aware_loftr_modes:
    - extreme_textureless
  source_aware_loftr_min_confirmation_frames: 4
  semidense_fallback_sidecar_max_extra: 18
  semidense_fallback_max_new: 36
  semidense_fallback_max_fraction: 0.08
  promotion_loftr_min_quality: 0.24
  promotion_loftr_max_fb_error: 0.80
  promotion_loftr_min_ncc: 0.60
  promotion_loftr_min_h_inlier_ratio: 0.85

measurement_selection:
  enabled: false

backend_quality:
  mode: source_aware
  floor: 0.80
  alpha: 0.85
