extends: ../paper_full_quality_hybrid_frontend.yaml

hybrid:
  # UVVID Orientkaj RGB search probe.
  #
  # The RGB stream contains genuine low-texture / low-coverage spans where the
  # formal paper gates often leave only one or two post-validated LoFTR
  # candidates. This probe lowers the minimum sparse refill size so those
  # candidates can be tested in VINS full/drop. It is intentionally a screening
  # profile, not a final paper-safe policy.
  source_aware_loftr_modes:
    - severe_low_texture
    - low_coverage_recovery
    - low_texture
    - identity_churn
    - planar_near_wall
    - extreme_textureless

  semidense_acceptance_min_new_tracks: 1
  semidense_acceptance_min_new_cells: 1
  semidense_acceptance_min_grid_gain: 0.000
  semidense_acceptance_min_new_cell_ratio: 0.00
  semidense_acceptance_subset_on_geometry_fail: true
  semidense_acceptance_subset_max_count: 6
  semidense_acceptance_subset_min_count: 1
  semidense_acceptance_subset_max_per_cell: 1

  semidense_candidate_min_quality: 0.06
  semidense_candidate_min_ncc: 0.30
  semidense_candidate_max_fb_error: 1.80
  semidense_candidate_max_epipolar_error: 3.00
  semidense_candidate_max_homography_error: 5.00

  source_aware_loftr_requires_confirmation: true
  source_aware_loftr_min_confirmation_frames: 2
  source_aware_loftr_min_grid_gain: 0.000
  source_aware_loftr_min_new_cell_ratio: 0.00
  source_aware_loftr_max_epipolar_error: 3.00
  source_aware_loftr_max_homography_error: 5.00
  source_aware_loftr_min_h_inlier_ratio: 0.60

  promotion_loftr_min_quality: 0.06
  promotion_loftr_min_ncc: 0.30
  promotion_loftr_max_fb_error: 1.80
  promotion_loftr_max_grid_texture_score: 1.01
  promotion_loftr_min_flat_region_ratio: 0.00
  promotion_loftr_min_h_inlier_ratio: 0.60

measurement_selection:
  enabled: false
